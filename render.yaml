databases:
  - name: kiranaos-db
    databaseName: kiranaos
    user: kiranaos

services:
  - type: redis
    name: kiranaos-redis
    ipAllowList: []

  - type: web
    name: kiranaos-backend
    env: node
    rootDir: backend
    buildCommand: npm install && npx prisma generate && npx prisma db push && npm run seed && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: kiranaos-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: kiranaos-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: kiranaos-redis
          property: port
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
