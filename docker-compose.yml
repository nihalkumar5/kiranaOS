version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: kiranaos_db
    restart: always
    environment:
      POSTGRES_USER: kiranaos_user
      POSTGRES_PASSWORD: kiranaos_password
      POSTGRES_DB: kiranaos_db
    ports:
      - '5436:5432' # Map to 5436 on host for local development tool access
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - kiranaos_net

  # 2. Redis Cache Service
  redis:
    image: redis:7-alpine
    container_name: kiranaos_redis
    restart: always
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - kiranaos_net

  # 3. NestJS API Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kiranaos_backend
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://kiranaos_user:kiranaos_password@db:5432/kiranaos_db?schema=public
      JWT_SECRET: supersecretjwtkey123!
      JWT_REFRESH_SECRET: supersecretjwtrefreshkey123!
      REDIS_HOST: redis
      REDIS_PORT: 6379
    ports:
      - '3000:3000' # NestJS API exposed on host port 3000
    depends_on:
      - db
      - redis
    networks:
      - kiranaos_net

  # 4. Next.js POS Front-end Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kiranaos_frontend
    restart: always
    environment:
      NODE_ENV: development
      # Browser (client-side) uses localhost:3000 directly - bypasses proxy complexity
      NEXT_PUBLIC_API_URL: http://10.247.235.75:3000
      # SSR (server-side) uses Docker internal hostname
      INTERNAL_API_URL: http://kiranaos_backend:3000
      PORT: 3001
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: npm run dev
    ports:
      - '3001:3001' # Next.js client POS exposed on host port 3001
    depends_on:
      - backend
    networks:
      - kiranaos_net

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  kiranaos_net:
    driver: bridge
